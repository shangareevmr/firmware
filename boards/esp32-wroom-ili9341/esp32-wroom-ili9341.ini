[env:esp32-wroom-ili9341]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-wroom-ili9341>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/esp32-wroom-ili9341
	-DESP32_WROOM_ILI9341=1
	-DDEVICE_NAME='"ESP32-WROOM-ILI9341"'
	-DIR_TX_PINS='{{"Pin 5", 5}}'
	-DIR_RX_PINS='{{"Pin 5", 5}, {"Pin 36", 36}}'
	-DRF_TX_PINS='{{"Pin 5", 5}}'
	-DRF_RX_PINS='{{"Pin 5", 5}, {"Pin 36", 36}}'

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}
